<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>k6 Load Test Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #111827; margin: 0; padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.5rem; font-weight: 600; margin-bottom: 30px; color: #111827; }
        h2 { font-size: 1.25rem; font-weight: 600; text-align: center; margin-top: 40px; margin-bottom: 16px; color: #1f2937; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 0.875rem; }
        th { text-align: left; padding: 10px 12px; font-weight: 600; color: #4b5563; border-bottom: 1px solid #e5e7eb; background-color: #f9fafb; }
        td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; color: #374151; }
        tr:nth-child(even) { background-color: #f9fafb; }
        .grid-row { display: flex; gap: 40px; flex-wrap: wrap; }
        .grid-col { flex: 1; min-width: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>k6 Load Test Report</h1>
        
        <!-- Trends Section -->
        <h2>Trends</h2>
        <table>
            <thead>
                <tr>
                    <th>metric</th>
                    <th>avg</th>
                    <th>max</th>
                    <th>med</th>
                    <th>min</th>
                    <th>p90</th>
                    <th>p95</th>
                    <th>p99</th>
                </tr>
            </thead>
            <tbody id="trends-body"></tbody>
        </table>

        <div class="grid-row">
            <!-- Counters Section -->
            <div class="grid-col">
                <h2>Counters</h2>
                <table>
                    <thead>
                        <tr>
                            <th>metric</th>
                            <th>count</th>
                            <th>rate</th>
                        </tr>
                    </thead>
                    <tbody id="counters-body"></tbody>
                </table>
            </div>

            <!-- Rates & Gauges Section -->
            <div class="grid-col">
                <h2>Rates</h2>
                <table>
                    <thead>
                        <tr>
                            <th>metric</th>
                            <th>rate</th>
                        </tr>
                    </thead>
                    <tbody id="rates-body"></tbody>
                </table>

                <h2>Gauges</h2>
                <table>
                    <thead>
                        <tr>
                            <th>metric</th>
                            <th>value</th>
                        </tr>
                    </thead>
                    <tbody id="gauges-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const data = {"root_group":{"id":"d41d8cd98f00b204e9800998ecf8427e","groups":[],"checks":[{"name":"status is 200","path":"::status is 200","id":"6210a8cd14cd70477eba5c5e4cb3fb5f","passes":446,"fails":0}],"name":"","path":""},"options":{"noColor":false,"summaryTrendStats":["avg","min","med","max","p(50)","p(90)","p(95)","p(99)"],"summaryTimeUnit":""},"state":{"testRunDurationMs":20254.648,"isStdOutTTY":true,"isStdErrTTY":true},"metrics":{"http_req_waiting":{"contains":"time","values":{"p(99)":259.35599999999965,"avg":118.58733632286992,"min":3.883,"med":127.33950000000002,"max":442.184,"p(50)":127.33950000000002,"p(90)":230.58669999999998,"p(95)":233.19129999999998},"type":"trend"},"http_req_duration{expected_response:true}":{"contains":"time","values":{"p(90)":230.87030000000001,"p(95)":233.57649999999998,"p(99)":259.58397999999966,"avg":118.85494730941703,"min":4.011,"med":127.48750000000001,"max":442.395,"p(50)":127.48750000000001},"type":"trend"},"http_req_tls_handshaking":{"type":"trend","contains":"time","values":{"med":0,"max":349.624,"p(50)":0,"p(90)":0,"p(95)":0,"p(99)":231.05405,"avg":3.057758968609866,"min":0}},"data_sent":{"contains":"data","values":{"count":75823,"rate":3743.48643333619},"type":"counter"},"http_req_sending":{"contains":"time","values":{"min":0.025,"med":0.08,"max":0.716,"p(50)":0.08,"p(90)":0.11790000000000002,"p(95)":0.13,"p(99)":0.17417999999999997,"avg":0.08577802690582971},"type":"trend"},"vus":{"type":"gauge","contains":"default","values":{"value":1,"min":1,"max":9}},"iteration_duration":{"type":"trend","contains":"time","values":{"p(50)":235.27125,"p(90)":244.4316665,"p(95)":260.1665729999999,"p(99)":725.5347166,"avg":250.05965795739937,"min":226.889667,"med":235.27125,"max":1036.841542}},"http_req_connecting":{"type":"trend","contains":"time","values":{"p(95)":0,"p(99)":222.60854,"avg":2.861035874439462,"min":0,"med":0,"max":312.9,"p(50)":0,"p(90)":0}},"iterations":{"type":"counter","contains":"default","values":{"rate":22.01963717167536,"count":446}},"http_reqs":{"type":"counter","contains":"default","values":{"count":892,"rate":44.03927434335072}},"http_req_receiving":{"type":"trend","contains":"time","values":{"max":9.911,"p(50)":0.079,"p(90)":0.203,"p(95)":0.5613999999999988,"p(99)":1.8118699999999996,"avg":0.18183295964125537,"min":0.028,"med":0.079}},"vus_max":{"contains":"default","values":{"min":10,"max":10,"value":10},"type":"gauge"},"http_req_blocked":{"type":"trend","contains":"time","values":{"max":680.897,"p(50)":0.001,"p(90)":0.001,"p(95)":0.002,"p(99)":453.88572,"avg":5.9761132286997105,"min":0,"med":0.001}},"checks":{"type":"rate","contains":"default","values":{"fails":0,"rate":1,"passes":446}},"data_received":{"type":"counter","contains":"data","values":{"count":1709250,"rate":84388.03774817513}},"http_req_failed":{"type":"rate","contains":"default","values":{"fails":892,"rate":0,"passes":0}},"http_req_duration":{"type":"trend","contains":"time","values":{"p(50)":127.48750000000001,"p(90)":230.87030000000001,"p(95)":233.57649999999998,"p(99)":259.58397999999966,"avg":118.85494730941703,"min":4.011,"med":127.48750000000001,"max":442.395}}}};

        // Helper formatters matching k6 text output conventions
        function formatDuration(ms) {
            if (ms === undefined || ms === null) return '-';
            if (ms >= 1000) return (ms / 1000).toFixed(0) + 's';
            if (ms >= 1) return ms.toFixed(0) + 'ms';
            if (ms >= 0.001) return (ms * 1000).toFixed(0) + 'µs';
            return ms.toFixed(0) + 'ms';
        }

        function formatBytes(bytes) {
            if (bytes === undefined || bytes === null) return '-';
            if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' kB';
            return bytes + ' B';
        }

        function formatRate(val, isData = false) {
            if (val === undefined || val === null) return '-';
            if (isData) {
                if (val >= 1024 * 1024) return (val / (1024 * 1024)).toFixed(2) + ' MB/s';
                if (val >= 1024) return (val / 1024).toFixed(1) + ' kB/s';
                return val.toFixed(0) + ' B/s';
            }
            return val.toFixed(2) + '/s';
        }

        function renderReport() {
            const metrics = data.metrics || {};

            // 1. Trends Table
            const trendKeys = [
                'http_req_blocked', 'http_req_connecting', 'http_req_duration', 
                'http_req_receiving', 'http_req_sending', 'http_req_tls_handshaking', 
                'http_req_waiting', 'iteration_duration'
            ];
            document.getElementById('trends-body').innerHTML = trendKeys.map(key => {
                const m = metrics[key]?.values;
                if (!m) return '';
                return `<tr>
                    <td>${key}</td>
                    <td>${formatDuration(m.avg)}</td>
                    <td>${formatDuration(m.max)}</td>
                    <td>${formatDuration(m.med)}</td>
                    <td>${formatDuration(m.min)}</td>
                    <td>${formatDuration(m['p(90)'])}</td>
                    <td>${formatDuration(m['p(95)'])}</td>
                    <td>${formatDuration(m['p(99)'])}</td>
                </tr>`;
            }).join('');

            // 2. Counters Table
            const counterKeys = ['data_received', 'data_sent', 'http_reqs', 'iterations'];
            document.getElementById('counters-body').innerHTML = counterKeys.map(key => {
                const m = metrics[key]?.values;
                if (!m) return '';
                const isData = key.includes('data');
                const countStr = isData ? formatBytes(m.count) : m.count.toLocaleString();
                const rateStr = formatRate(m.rate, isData);
                return `<tr>
                    <td>${key}</td>
                    <td>${countStr}</td>
                    <td>${rateStr}</td>
                </tr>`;
            }).join('');

            // 3. Rates Table
            const rateKeys = ['checks', 'http_req_failed'];
            document.getElementById('rates-body').innerHTML = rateKeys.map(key => {
                const m = metrics[key]?.values;
                if (!m) return '';
                let rateVal = '0.0%';
                if (m.rate !== undefined) {
                    rateVal = (m.rate * 100).toFixed(1) + '%';
                } else if (m.passes !== undefined && (m.passes + m.fails) > 0) {
                    rateVal = ((m.passes / (m.passes + m.fails)) * 100).toFixed(1) + '%';
                }
                return `<tr>
                    <td>${key}</td>
                    <td>${rateVal}</td>
                </tr>`;
            }).join('');

            // 4. Gauges Table
            const gaugeKeys = ['vus', 'vus_max'];
            document.getElementById('gauges-body').innerHTML = gaugeKeys.map(key => {
                const m = metrics[key]?.values;
                if (!m) return '';
                return `<tr>
                    <td>${key}</td>
                    <td>${m.value}</td>
                </tr>`;
            }).join('');
        }

        window.addEventListener('DOMContentLoaded', renderReport);
    </script>
</body>
</html>
